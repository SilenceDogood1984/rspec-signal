plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: true

Layout/LineLength:
  Max: 120

Naming/FileName:
  # The conventional `gem "rspec-signal"` entry point.
  Exclude:
    - "lib/rspec-signal.rb"

# Value objects here are intentionally keyword-heavy.
Metrics/ParameterLists:
  CountKeywordArgs: false

# The reduction algorithm, the report renderer and the backtrace fixtures are
# linear and readable; splitting them further to satisfy a counter would make
# them harder to follow, not easier.
Metrics/AbcSize:
  Max: 30
  Exclude:
    - "spec/fixtures/**/*"

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/PerceivedComplexity:
  Max: 11

Metrics/ClassLength:
  Max: 200

Metrics/MethodLength:
  Max: 20
  Exclude:
    - "spec/fixtures/**/*"

Metrics/ModuleLength:
  Exclude:
    - "spec/fixtures/**/*"

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

Style/ConcatArrayLiterals:
  Exclude:
    - "spec/fixtures/**/*"

RSpec/ExampleLength:
  Max: 20

RSpec/MultipleExpectations:
  Max: 4

RSpec/NestedGroups:
  Max: 4

RSpec/SpecFilePathFormat:
  Enabled: false

RSpec/DescribeClass:
  Enabled: false
