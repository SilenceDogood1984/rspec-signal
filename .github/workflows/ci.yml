name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: "Ruby ${{ matrix.ruby }} / RSpec ${{ matrix.rspec }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["2.7", "3.0", "3.1", "3.2", "3.3", "3.4"]
        rspec: ["3.13"]
        include:
          # Oldest supported RSpec, to keep the formatter API assumptions honest
          # on both the newest and the oldest Ruby we support.
          - ruby: "3.3"
            rspec: "3.10"
          - ruby: "2.7"
            rspec: "3.10"
    env:
      RSPEC_VERSION: ${{ matrix.rspec }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run specs
        run: bundle exec rspec

  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop
